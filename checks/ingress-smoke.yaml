# Ingress smoke test: http://localhost:<INGRESS_HTTP_HOST_PORT from lab.env>/ should return the
# nginx welcome page.
# Apply, check, then: kubectl delete namespace ingress-smoke
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: ingress-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: ingress-smoke
spec:
  selector:
    app: echo
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo
  namespace: ingress-smoke
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80
