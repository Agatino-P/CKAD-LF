# NetworkPolicy enforcement check, part 1: a web server and a client, no policy yet.
# From client, http://web must be reachable before 02-deny-all.yaml is applied.
apiVersion: v1
kind: Namespace
metadata:
  name: netpol-check
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: netpol-check
  labels:
    app: web
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: netpol-check
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: netpol-check
spec:
  containers:
    - name: busybox
      image: busybox:1.37
      command: ["sleep", "3600"]
