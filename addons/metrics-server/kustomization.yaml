# metrics-server, needed for `kubectl top` and HorizontalPodAutoscaler exercises.
# upstream/components.yaml is the unmodified release manifest from
#   https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - upstream/components.yaml
patches:
  # kind's kubelet serving certificates are not signed for the node addresses metrics-server
  # connects to, so TLS verification against the kubelets fails without this flag.
  - target:
      kind: Deployment
      name: metrics-server
      namespace: kube-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
